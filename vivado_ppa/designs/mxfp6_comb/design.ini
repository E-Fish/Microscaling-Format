# Your E2M3 FP6 multiplier (mxfp6_mult) with registered inputs/outputs (mxfp6_wrapper)

[design]
top      = mxfp6_wrapper
sources  = mxfp6_mult.sv mxfp6_wrapper.sv
clock    = clk
latency  = 2      # input reg + output reg, no internal pipeline stages
ii       = 1      # a new block can enter every cycle

[variants]
E2M3    = N=32
E2M3_N2 = N=2
