# TEMPLATE: copy this folder to designs/<new_name>/, put your .sv files in it,
# and fill in the settings below. Folders starting with _ are ignored by the script.

[design]
# Top module to synthesize. It should register its inputs and outputs (like mxfp6_wrapper).
top      = my_wrapper

# Your .sv files in this folder, separated by spaces
sources  = my_core.sv my_wrapper.sv

# Name of the clock port on the top module
clock    = clk

# Cycles from input port to output port:
#   combinational core + input/output registers = 2
#   core with 3 internal pipeline stages        = 2 + 3 = 5
latency  = 2

# Cycles between new inputs (1 = fully pipelined)
ii       = 1

# Optional: elements per input. Not needed if your module has an N parameter.
# elements = 32

[variants]
# One line per variant:  LABEL = PARAM=value PARAM=value ...
# PARAM names must match your top module's parameters.
# Add latency=X to override the latency for one variant.
# Use the same labels across designs (E2M1, E2M3, E3M2, E4M3, E5M2) so rows line up.
E2M3    = EXP=2 MAN=3 N=32
E2M3_S3 = EXP=2 MAN=3 N=32 STAGES=3 latency=5
