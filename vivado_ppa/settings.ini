# settings.ini: shared settings for vivado_ppa.py
# Set these once. Changing part or directives later makes new rows
# not directly comparable with old ones (they are recorded in each row).

[vivado]
# The vivado program. Leave as "vivado" if typing  vivado -version  in a terminal works.
# Otherwise put the full path, e.g. /opt/Xilinx/Vivado/2023.2/bin/vivado
# (find it in the Vivado GUI Tcl Console with:  puts $env(XILINX_VIVADO)/bin/vivado )
path = /opt/xilinx-full/2025.1/Vivado/bin/vivado

# FPGA part. Find it in the Vivado GUI Tcl Console with:  get_property PART [current_project]
part = xcv80-lsva4737-2MHP-e-S

[defaults]
# Clock period in ns used when you don't choose one (5 ns = 200 MHz)
period_ns = 3

# yes = synthesis + place + route (accurate timing, slower)
# no  = synthesis only (fast, timing is an estimate)
implementation = yes

# Vivado strategies. default / Default are Vivado's normal settings.
synth_directive = default
impl_directive  = Default

# How many Vivado runs to do at the same time (each uses a few GB of memory)
jobs = 1

# yes = also save a design checkpoint (.dcp) per run, a few MB each
save_checkpoint = no
